name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um novo push no mesmo branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Contraste de cores (WCAG AA)
        run: npm run contrast
      - name: Testes (unitários, componentes e API local) com cobertura
        run: npm run test:coverage
      - name: Build de produção
        run: npm run build
      - name: Orçamento de tamanho (JS/CSS por página)
        run: npm run size
      - name: Relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  backend:
    name: Backend (tipos, testes com PostgreSQL, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: globalscholar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/globalscholar_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Testes (contrato da API, elegibilidade, configuração) contra PostgreSQL
        run: npm test
      - name: Build
        run: npm run build
      - name: Migrações batem com o esquema (nenhuma migração pendente de gerar)
        run: |
          npx drizzle-kit generate --name ci-check
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "O esquema mudou sem migração. Rode 'npm run db:generate' no backend e versione a pasta drizzle/."
            git status --porcelain drizzle
            exit 1
          fi

  e2e:
    name: Ponta a ponta (Playwright + backend + PostgreSQL)
    runs-on: ubuntu-latest
    needs: [quality, backend]
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: globalscholar_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/globalscholar_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm ci --prefix backend
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes de ponta a ponta (fluxos, acessibilidade com axe, teclado, segurança)
        run: npm run test:e2e
      - name: Relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
