# Blueprint do Render (https://render.com/docs/blueprint-spec).
# Cria: a base de dados PostgreSQL, a API (backend/) e o frontend Next.js. Passo a passo em docs/deploy-render.md.
databases:
  - name: globalscholar-db
    # Plano gratuito: a base é APAGADA 30 dias após a criação. Antes de ter estudantes reais, mude para "basic-256mb" (com backups).
    plan: free
    region: frankfurt
    databaseName: globalscholar
    user: globalscholar
    # Só os serviços do Render acessam a base (nenhum IP externo).
    ipAllowList: []

services:
  # O nome continua "globalscholar-api-demo" para não mudar a URL que o frontend já usa;
  # desde a B1 este serviço roda o backend REAL (backend/) com PostgreSQL, não mais a API de demonstração.
  - type: web
    name: globalscholar-api-demo
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    # Aplica as migrações pendentes e inicia a API.
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: globalscholar-db
          property: connectionString
      # URL exata do frontend (sem barra no fim). Mude aqui se o Render der outro endereço ao frontend.
      - key: CORS_ORIGIN
        value: https://globalscholar-web.onrender.com
      # Endereço público do site (links dos e-mails de redefinição de senha).
      - key: APP_URL
        value: https://globalscholar-web.onrender.com
      # "log": o e-mail de redefinição de senha só aparece nos Logs deste serviço (provisório).
      # Para os estudantes receberem o e-mail de verdade: EMAIL_PROVIDER=resend + RESEND_API_KEY (ver docs/deploy-render.md).
      - key: EMAIL_PROVIDER
        value: log
      # Chave que o site usa para não cair no limite de requisições por IP. Gerada pelo Render; o site lê daqui.
      - key: INTERNAL_API_SECRET
        generateValue: true
      # Bolsas FICTÍCIAS de demonstração. Mude para "0" quando houver bolsas reais cadastradas.
      - key: SEED_DEMO_DATA
        value: "1"
      - key: LOG_LEVEL
        value: info

  - type: web
    name: globalscholar-web
    runtime: node
    plan: free
    region: frankfurt
    # --include=dev: o build precisa de TypeScript e ESLint (devDependencies).
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: NEXT_PUBLIC_DATA_MODE
        value: api
      # O navegador fala com /api do próprio site, que repassa ao backend (cookie de login de primeira parte).
      - key: NEXT_PUBLIC_API_BASE_URL
        value: /api
      # Endereço do backend usado pelo repasse /api e pelas páginas renderizadas no servidor. Lido no BUILD.
      - key: API_INTERNAL_URL
        value: https://globalscholar-api-demo.onrender.com
      - key: INTERNAL_API_SECRET
        fromService:
          type: web
          name: globalscholar-api-demo
          envVarKey: INTERNAL_API_SECRET
      # Anexos de documentos (enviados ao backend, guardados no PostgreSQL).
      - key: NEXT_PUBLIC_UPLOADS_ENABLED
        value: "true"
      # URL pública do próprio frontend (metadados, sitemap, imagens de compartilhamento), ex.: https://globalscholar-web.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
